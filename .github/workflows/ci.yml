name: ci
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: dependencies, exactly as locked
        run: uv sync --frozen
      - name: lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: tests, 100 % line and branch coverage
        run: uv run pytest -q --cov
      - name: the wheel builds and imports with no extras
        run: |
          uv build --wheel -o dist
          python -m venv /tmp/bare && /tmp/bare/bin/pip install -q dist/*.whl
          /tmp/bare/bin/python -c "import nascommon.auth, nascommon.web, nascommon.pwa, nascommon.bridge, nascommon.webpush, nascommon.google_oauth, nascommon.scheduling; print('ok')"
